<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050711">
  <meta name="description" content="A little animated heart, made with love.">
  <title>Love You</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050711; }
    body { color: #f7f6ff; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #scene.fading { transition: opacity 3s ease-out; opacity: 0; }
    .start-screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 45%, #12172b 0%, #090c18 42%, #050711 78%); transition: opacity .5s ease, visibility .5s ease; }
    .start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card { width: min(100%, 390px); padding: 34px 28px 30px; text-align: center; border: 1px solid rgba(167, 186, 255, .18); border-radius: 22px; background: rgba(13, 17, 32, .72); box-shadow: 0 22px 80px rgba(0, 0, 0, .36), inset 0 1px rgba(255,255,255,.035); backdrop-filter: blur(12px); }
    .mark { margin: 0 0 12px; color: #89a8ff; font-size: 32px; line-height: 1; text-shadow: 0 0 26px rgba(86, 135, 255, .55); }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(28px, 8vw, 36px); font-weight: 500; letter-spacing: .01em; }
    .note { margin: 12px 0 24px; color: #aeb5ce; font-size: 14px; line-height: 1.55; }
    button { min-height: 48px; padding: 0 25px; border: 0; border-radius: 999px; color: #09101e; background: linear-gradient(135deg, #a8c2ff, #7297ff); font-family: inherit; font-size: 14px; font-weight: 650; letter-spacing: .02em; cursor: pointer; box-shadow: 0 8px 30px rgba(89, 132, 255, .25); transition: transform .16s ease, filter .16s ease; }
    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button:active { transform: translateY(1px) scale(.99); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .small { margin: 15px 0 0; color: #777f9b; font-size: 12px; }
    .replay { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); min-height: 40px; padding: 0 18px; opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
    .replay.visible { opacity: 1; visibility: visible; }
    @media (prefers-reduced-motion: reduce) { .start-screen, button, .replay { transition-duration: .01ms; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Blue glowing words forming a heart"></canvas>
  <main id="startScreen" class="start-screen">
    <section class="card" aria-labelledby="title">
      <p class="mark" aria-hidden="true">♥</p>
      <h1 id="title">Love You</h1>
      <p class="note">The music and animation will start together when you’re ready.</p>
      <button id="startButton" type="button">Start</button>
      <p class="small">Turn your sound on ♡</p>
    </section>
  </main>
  <button id="replayButton" class="replay" type="button">Play again</button>
  <audio id="music" src="love_you.mp3" preload="auto" playsinline></audio>
  <script>
    (() => {
      'use strict';
      const W = 2000, H = 1200, SCALE = 20;
      const WORDS = ['love you', 'Love You', 'LOVE YOU'];
      const COLORS = ['#4682b4', '#1e90ff', '#00bfff', '#6495ed', '#4169e1'];
      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d', { alpha: false });
      const audio = document.getElementById('music');
      const startScreen = document.getElementById('startScreen');
      const startButton = document.getElementById('startButton');
      const replayButton = document.getElementById('replayButton');
      let particles = [];
      let fillStart = 0;
      let sceneScale = 1, offsetX = 0, offsetY = 0, pixelRatio = 1;
      let started = false, raf = 0;

      function heartXY(t) {
        const x = 16 * Math.sin(t) ** 3;
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        return [x, -y];
      }
      function screenXY(x, y) { return [x * SCALE + W / 2, y * SCALE + H / 2]; }
      function farEnough(x, y, placed, gap) {
        for (const [px, py] of placed) if (Math.hypot(x - px, y - py) < gap) return false;
        return true;
      }
      function makeParticle(x, y, order, kind) {
        const p = { x, y, order, kind, word: WORDS[(Math.random() * WORDS.length) | 0], color: COLORS[(Math.random() * COLORS.length) | 0], flicker: Math.random() * Math.PI * 2, size: .85 + Math.random() * .3, delay: 0 };
        p.sprites = makeSprites(p);
        return p;
      }
      function makeSprite(text, color, px, blur, expansion = 0) {
        const measure = document.createElement('canvas').getContext('2d');
        measure.font = `700 ${px}px Arial, sans-serif`;
        const width = Math.ceil(measure.measureText(text).width) + 4;
        const height = Math.ceil(px * 1.5) + 4;
        const margin = Math.ceil(blur * 2 + expansion);
        const sprite = document.createElement('canvas');
        sprite.width = width + margin * 2;
        sprite.height = height + margin * 2;
        const s = sprite.getContext('2d');
        s.font = `700 ${px}px Arial, sans-serif`;
        s.textAlign = 'center';
        s.textBaseline = 'middle';
        s.fillStyle = color;
        if (blur) { s.shadowColor = color; s.shadowBlur = blur; }
        s.fillText(text, sprite.width / 2, sprite.height / 2);
        return sprite;
      }
      function makeSprites(p) {
        const px = (p.kind === 'outline' ? 20 : 17) * p.size;
        return {
          text: makeSprite(p.word, p.color, px, 0),
          small: makeSprite(p.word, p.color, px, px * .72, px * .3),
          big: makeSprite(p.word, p.color, px, px * 1.35, px * .8)
        };
      }
      const centerPhrase = ' Love You ';
      const centerSprites = {
        text: makeSprite(centerPhrase, '#fffaf5', 54, 0),
        small: makeSprite(centerPhrase, '#fffaf5', 54, 54 * .72, 54 * .3),
        big: makeSprite(centerPhrase, '#fffaf5', 54, 54 * 1.35, 54 * .8)
      };
      const centerFlicker = Math.random() * Math.PI * 2;
      function buildParticles() {
        const outline = [], placedOutline = [];
        for (let i = 0; i < 160; i++) {
          const [bx, by] = heartXY(i / 160 * Math.PI * 2);
          const [x, y] = screenXY(bx, by);
          if (!farEnough(x, y, placedOutline, 30)) continue;
          placedOutline.push([x, y]);
          outline.push(makeParticle(x, y, i, 'outline'));
        }
        const fill = [], placedFill = [];
        let attempts = 0;
        while (fill.length < 130 && attempts < 130 * 80) {
          attempts++;
          const t = Math.random() * Math.PI * 2, r = Math.random() * .86;
          const [bx, by] = heartXY(t);
          const [x, y] = screenXY(bx * r, by * r);
          if (!farEnough(x, y, placedFill, 46)) continue;
          placedFill.push([x, y]);
          fill.push(makeParticle(x, y, (Math.random() * 321) | 0, 'fill'));
        }
        const outlineSpan = Math.max(...outline.map(p => p.order));
        fillStart = Math.floor(outlineSpan * 1.6) + 30;
        for (const p of outline) p.delay = Math.floor(p.order * 1.6);
        for (const p of fill) p.delay = fillStart + p.order;
        particles = outline.concat(fill);
      }
      function resize() {
        pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        const width = window.innerWidth, height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        sceneScale = Math.min(width / W, height / H);
        offsetX = (width - W * sceneScale) / 2;
        offsetY = (height - H * sceneScale) / 2;
        drawFrame();
      }
      function drawFrame() {
        const width = canvas.width / pixelRatio, height = canvas.height / pixelRatio;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(sceneScale * pixelRatio, 0, 0, sceneScale * pixelRatio, offsetX * pixelRatio, offsetY * pixelRatio);
        if (!started) return;
        const frame = audio.currentTime * 60;
        for (const p of particles) {
          const reveal = Math.max(0, Math.min(1, (frame - p.delay) / 15));
          if (!reveal) continue;
          const flicker = reveal >= 1 ? .75 + .25 * Math.sin(frame * .04 + p.flicker) : 1;
          const alpha = reveal * flicker;
          const { big, small, text } = p.sprites;
          ctx.globalAlpha = alpha / 7;
          ctx.drawImage(big, p.x - big.width * 1.2 / 2, p.y - big.height * 1.2 / 2, big.width * 1.2, big.height * 1.2);
          ctx.globalAlpha = alpha / 3;
          ctx.drawImage(small, p.x - small.width * .8, p.y - small.height * .8, small.width * 1.6, small.height * 1.6);
          ctx.globalAlpha = alpha;
          ctx.drawImage(text, p.x - text.width / 2, p.y - text.height / 2);
        }
        ctx.globalAlpha = 1;
        const centerStart = fillStart + 200;
        if (frame > centerStart) {
          const progress = Math.min(1, (frame - centerStart) / 60);
          const alpha = 1 - Math.exp(-progress * 8);
          const pulse = 1 + .025 * Math.sin(frame * .015);
          const flicker = alpha >= 1 ? .75 + .25 * Math.sin(frame * .012 + centerFlicker) : 1;
          const glowAlpha = alpha * flicker;
          ctx.save();
          ctx.translate(W / 2, H / 2);
          ctx.scale(pulse, pulse);
          ctx.globalAlpha = glowAlpha / 7;
          ctx.drawImage(centerSprites.big, -centerSprites.big.width * 1.2, -centerSprites.big.height * 1.2, centerSprites.big.width * 2.4, centerSprites.big.height * 2.4);
          ctx.globalAlpha = glowAlpha / 3;
          ctx.drawImage(centerSprites.small, -centerSprites.small.width * .8, -centerSprites.small.height * .8, centerSprites.small.width * 1.6, centerSprites.small.height * 1.6);
          ctx.globalAlpha = glowAlpha;
          ctx.drawImage(centerSprites.text, -centerSprites.text.width / 2, -centerSprites.text.height / 2);
          ctx.restore();
        }
      }
      function animate() {
        drawFrame();
        if (started && !audio.paused && !audio.ended) raf = requestAnimationFrame(animate);
      }
      async function play() {
        startButton.disabled = true;
        startButton.textContent = 'Loading…';
        try {
          canvas.classList.remove('fading');
          audio.currentTime = 0;
          await audio.play();
          started = true;
          startScreen.classList.add('hidden');
          replayButton.classList.remove('visible');
          cancelAnimationFrame(raf);
          animate();
        } catch (error) {
          startButton.disabled = false;
          startButton.textContent = 'Try again';
          document.querySelector('.note').textContent = 'The audio could not start. Tap Start again.';
        }
      }
      startButton.addEventListener('click', play);
      replayButton.addEventListener('click', play);
      audio.addEventListener('ended', () => {
        canvas.classList.add('fading');
        window.setTimeout(() => replayButton.classList.add('visible'), 3000);
      });
      window.addEventListener('resize', resize, { passive: true });
      buildParticles();
      resize();
    })();
  </script>
</body>
</html>
